name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Checkout hiddify-core's verified sibling engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/SawaMEN/hiddify-sing-box.git ../hiddify-sing-box
          if [ "$(git -C ../hiddify-sing-box rev-parse HEAD)" != "a64b3444a3f408a5651a027bc4542af713c6b35c" ]; then
            git -C ../hiddify-sing-box fetch --depth=1 origin a64b3444a3f408a5651a027bc4542af713c6b35c
            git -C ../hiddify-sing-box checkout a64b3444a3f408a5651a027bc4542af713c6b35c
            git -C ../hiddify-sing-box submodule update --init --recursive
          fi
          test "$(git -C ../hiddify-sing-box rev-parse HEAD)" = a64b3444a3f408a5651a027bc4542af713c6b35c
      - name: Download parser dependencies
        run: go mod download all
      - name: Test parser, CLI and examples
        run: go test -mod=readonly -race -ldflags=-checklinkname=0 ./...
